    <meta name="theme-color" content="#0c0c0d" />

    <meta
      name="description"
      content="Data Scientist with a BSc in Mathematics and an MSc in Data Science & Business Analytics. I turn a mathematics and statistics foundation into practical machine learning, deep learning and applied AI — data, features, honest evaluation, RAG, then FastAPI services and deployed systems."

      property="og:description"
      content="From Mathematics to Machine Learning — a mathematics-grounded data scientist building real ML, RAG and applied-AI systems."
    />
    <script>
      /* Set the theme before the first paint so there is no flash.
         Dark is the default; an explicit choice is remembered. */
      ;(function () {
        var COLORS = { dark: "#0c0c0d", light: "#fafaf9" }
        var theme = "dark"
        try {
          if (localStorage.getItem("portfolio-theme") === "light") theme = "light"
        } catch (e) {}
        document.documentElement.classList.toggle(
          "dark",
          theme === "dark",
        )
        var meta = document.querySelector('meta[name="theme-color"]')
        if (!meta) {
          meta = document.createElement("meta")
          meta.name = "theme-color"
          document.head.appendChild(meta)
        }
        meta.setAttribute("content", COLORS[theme])
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>

  </body>
</html>
