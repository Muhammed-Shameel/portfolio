<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#131210" />
    <title>Muhammed Shameel — Data Scientist &amp; AI Engineer</title>
    <meta
      name="description"
      content="Data Scientist and AI Engineer with a foundation in Mathematics and Data Science. End-to-end machine learning, RAG and agentic AI systems — from data, features and honest evaluation to FastAPI services, Dockerised builds and React or Next.js interfaces."
    />
    <script>
      /* Set the theme before the first paint so there is no flash.
         Dark is the default; an explicit choice is remembered. */
      ;(function () {
        var COLORS = { dark: "#131210", light: "#F6F3ED" }
        var theme = "dark"
        try {
          if (localStorage.getItem("portfolio-theme") === "light") theme = "light"
        } catch (e) {}
        document.documentElement.classList.toggle(
          "dark",
          theme === "dark",
        )
        var meta = document.querySelector('meta[name="theme-color"]')
        if (!meta) {
          meta = document.createElement("meta")
          meta.name = "theme-color"
          document.head.appendChild(meta)
        }
        meta.setAttribute("content", COLORS[theme])
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
